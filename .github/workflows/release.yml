# Copyright (c) 2026 Alexander Panasenko
# Contact: alex@prod.codes
# Author: https://prod.codes/about/
# Project: https://github.com/alex09x/rust-intelligence
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# A pushed tag vX.Y.Z builds both binaries from that tag on every platform, smoke-tests them on a small
# crate, and attaches ridx-<target>.tar.gz, its .sha256 and SHA256SUMS to the GitHub release of the tag
# (created as a draft when it does not exist yet). Existing assets are never overwritten.
#
# macOS: the build job has no Apple credentials. sign-macos (Environment release-signing) signs ridx and
# ridx-driver with the Developer ID and notarizes them without running them; verify-macos, without
# secrets, checks the signatures and Apple's ticket, runs the smoke test on the signed binaries and only
# then packages them. Missing credentials or a rejected submission stop the release: no ad-hoc fallback.
name: Release

on:
  push:
    # ridx versions only: `v*` also matched the extension's `vscode-v0.2.0` and started a release of it.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Toolchain pinned in rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - name: Build
        run: |
          set -euo pipefail
          # No checkout path in the binaries.
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/ridx --remap-path-prefix=$HOME=/home"
          export RIDX_BUILD_DIRTY=false
          cargo build --release --locked -p ridx -p ridx-driver
      - name: Smoke test on a small crate
        run: bash tools/release/smoke.sh "$GITHUB_WORKSPACE/target/release"
      - name: LSP session on a small crate
        run: |
          py=python3; python3 -c 1 2>/dev/null || py=python
          $py tools/release/lsp_smoke.py "$GITHUB_WORKSPACE/target/release"
      - name: Package
        if: runner.os != 'macOS'
        run: bash tools/release/package.sh target/release "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            target/release/ridx
            target/release/ridx-driver
          if-no-files-found: error

  sign-macos:
    needs: build
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    timeout-minutes: 40
    environment: release-signing
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: unsigned
      - name: Sign with the Developer ID and notarize, without running the binaries
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 tools/release/apple_sign.py unsigned signed notary-evidence
      - name: Remove the private credentials even after a failed step
        if: always()
        run: python3 tools/release/apple_keychain.py cleanup
      - name: Keep Apple's log of a refused submission
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notary-evidence-failed-${{ matrix.target }}
          path: notary-evidence/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.target }}
          path: |
            signed/ridx
            signed/ridx-driver
            notary-evidence/*.json
          if-no-files-found: error

  verify-macos:
    needs: sign-macos
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    # Each on its own architecture: the smoke test runs the signed binaries.
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-${{ matrix.target }}
          path: in
      - name: Developer ID, hardened runtime, entitlements and Apple's ticket
        run: |
          set -euo pipefail
          chmod +x in/signed/ridx in/signed/ridx-driver
          python3 tools/release/apple_verify.py in/signed in/notary-evidence
      - name: Toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Smoke test on the signed binaries
        run: bash tools/release/smoke.sh "$GITHUB_WORKSPACE/in/signed"
      - name: Package the signed binaries
        run: bash tools/release/package.sh in/signed ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [build, verify-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Attach to the release of the tag
        run: |
          set -euo pipefail
          cd dist
          # sha256sum on Windows marks the name binary (`*ridx-....zip`): one form for every line.
          cat ./*.sha256 | sed 's/ \*/  /' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Rust Intelligence ${TAG#v}" --notes "Release notes: CHANGELOG.md"
          fi
          existing=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in ./*.tar.gz ./*.zip ./*.sha256 SHA256SUMS; do
            name=$(basename "$f")
            if grep -qx "$name" <<<"$existing"; then
              echo "keeping the existing $name"
            else
              gh release upload "$TAG" "$f"
            fi
          done
