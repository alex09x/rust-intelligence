name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: "1"

jobs:
  check-and-test:
    name: Format, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, rustc-dev, llvm-tools-preview, rust-src

      - name: Configure sysroot shared library path for prefer-dynamic
        run: echo "LD_LIBRARY_PATH=$(rustc --print sysroot)/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy lints
        run: cargo clippy --workspace -- -D warnings

      - name: Run workspace unit and integration tests
        run: cargo test --workspace

      - name: Set up Python for benchmark harness tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run benchmark harness unit tests
        run: pytest -q bench/
