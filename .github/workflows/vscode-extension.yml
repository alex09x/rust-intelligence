# rust-intelligence — publishes the VS Code extension (editors/vscode)
# Copyright (c) 2026 Alexander Panasenko
#
# Contact: alex@prod.codes
# Author: https://prod.codes/about/
# Project: https://github.com/alex09x/rust-intelligence
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# A tag `vscode-v<version>` (the version in editors/vscode/package.json) packages the extension and publishes it to the
# Visual Studio Marketplace and to Open VSX, both through trusted publishing: each registry exchanges this workflow's
# OIDC token for a short-lived one, so no token is stored. The `vscode-marketplace` and `open-vsx` environments hold
# each publish job until the owner approves it. Open VSX needs, once, on open-vsx.org: the `alex09x` namespace, and
# this repository, this file and the `open-vsx` environment registered as its trusted publisher.
name: VS Code extension

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: The tag names the version in package.json
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: test "vscode-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npx vsce package --no-dependencies --out rust-intelligence.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/rust-intelligence.vsix

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: editors/vscode
      - name: Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath rust-intelligence.vsix

  # The same VSIX on Open VSX, the registry of VSCodium, Cursor, Windsurf, Gitpod and Eclipse Theia.
  publish-open-vsx:
    needs: package
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      - name: Open VSX, trusted publishing
        run: npx --yes ovsx@1.4.0 publish --trusted-publishing --packagePath vsix/rust-intelligence.vsix
