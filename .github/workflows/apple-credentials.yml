#
# Run by hand after tools/release/provision_apple_secrets.py: imports the Developer ID into a temporary
# Keychain, authenticates to the Notary API read-only (notarytool history), and removes everything.
name: Apple credentials check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    if: github.repository == 'alex09x/rust-intelligence' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identity import and read-only Notary API authentication
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 tools/release/apple_keychain.py check
      - name: Remove the private credentials
        if: always()
        run: python3 tools/release/apple_keychain.py cleanup
