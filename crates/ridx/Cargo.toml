[package]
name = "ridx"
version = "0.3.6"
edition = "2021"
description = "Compiler-backed, mmap-indexed CLI and LSP code intelligence tool for Rust"
authors = ["Alexander Panasenko <alex@prod.codes>"]
license = "MIT OR Apache-2.0"

[dependencies]
ridx-format = { path = "../ridx-format" }
ridx-syntax = { path = "../ridx-syntax" }
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
scip = "0.10.0"
protobuf = "3"

[dev-dependencies]
ridx-test-support = { path = "../ridx-test-support" }
tempfile = "3"
syn = { version = "2", features = ["full"] }
