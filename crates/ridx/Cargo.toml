[package]
name = "ridx"
version = "0.3.14"
edition = "2021"
description = "Compiler-backed, mmap-indexed CLI and LSP code intelligence tool for Rust"
authors = ["Alexander Panasenko <alex@prod.codes>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alex09x/rust-intelligence"
homepage = "https://rust-intelligence.com"
readme = "../../README.md"
keywords = ["lsp", "language-server", "rust-analyzer", "ide", "code-intelligence"]
categories = ["development-tools", "text-editors", "command-line-utilities"]
exclude = ["tests/"]

[dependencies]
ridx-format = { version = "0.3.14", path = "../ridx-format" }
ridx-syntax = { version = "0.3.14", path = "../ridx-syntax" }
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
scip = "0.10.0"
protobuf = "3"

[dev-dependencies]
ridx-test-support = { path = "../ridx-test-support" }
tempfile = "3"
syn = { version = "2", features = ["full"] }
