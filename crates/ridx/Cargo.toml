[package]
name = "ridx"
version = "0.1.0"
edition = "2021"
description = "CLI code intelligence tool for ultra-fast, zero-memory Rust code navigation"
authors = ["Alexander Panasenko <alex@prod.codes>"]
license = "MIT OR Apache-2.0"

[dependencies]
ridx-format = { path = "../ridx-format" }
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
