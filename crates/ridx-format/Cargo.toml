[package]
name = "ridx-format"
version = "0.3.0"
edition = "2021"
description = "Fast, compact, zero-copy binary index format for Rust Intelligence"
authors = ["Alexander Panasenko <alex@prod.codes>"]
license = "MIT OR Apache-2.0"

[dependencies]
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

